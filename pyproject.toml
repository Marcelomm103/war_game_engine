[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "war-game-engine"
version = "0.1.0"
description = "Reference rules engine for the WAR board game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "pydantic==2.14.1",
]

[project.scripts]
war-play = "war_game_engine.runner:main"

[project.optional-dependencies]
test = [
    "hypothesis==6.130.2",
    "pytest==9.0.3",
]
quality = [
    "coverage==7.17.0",
    "mypy==2.4.0",
    "mutmut==3.8.0",
    "ruff==0.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
war_game_engine = ["py.typed", "schemas/*.json"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
markers = ["rule_id: maps a test case to one or more WAR 1 rule IDs"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
strict = true

[tool.mutmut]
source_paths = ["src/war_game_engine/"]
pytest_add_cli_args_test_selection = ["tests/"]
